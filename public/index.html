<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI 群聊</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #ededed; color: #111; display: flex; flex-direction: column; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  header { background: #f7f7f7; border-bottom: 1px solid #ddd; padding: 10px 12px calc(8px + env(safe-area-inset-top, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px; flex: none; }
  header .title { flex: 1; min-width: 0; }
  header .gname { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .hbtn { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; flex: none; }
  #announce { background: #fffbe6; color: #7a6212; font-size: 12.5px; padding: 6px 12px; border-bottom: 1px solid #eee3ae; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #msgs { flex: 1; overflow-y: auto; padding: 12px 10px; -webkit-overflow-scrolling: touch; }
  .sys { text-align: center; color: #999; font-size: 12px; margin: 10px 0; }
  .sys span { background: rgba(0,0,0,.06); padding: 3px 8px; border-radius: 6px; }
  .row { display: flex; gap: 8px; margin: 12px 0; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .avatar { width: 38px; height: 38px; border-radius: 8px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex: none; user-select: none; }
  .col { max-width: 72%; display: flex; flex-direction: column; }
  .row.me .col { align-items: flex-end; }
  .name { font-size: 12px; color: #888; margin-bottom: 3px; }
  .bubble { background: #fff; border-radius: 8px; padding: 9px 11px; font-size: 15.5px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
  .row.me .bubble { background: #95ec69; }
  .bubble.cont { margin-top: -6px; }
  .quote { background: rgba(0,0,0,.06); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; color: #555; margin-bottom: 6px; max-width: 100%; word-break: break-word; }
  .row.me .quote { background: rgba(0,0,0,.08); }
  .stkimg { width: 130px; height: 130px; object-fit: contain; }
  .stkemoji { font-size: 84px; line-height: 1.1; }
  .favmark { font-size: 11px; color: #e6a23c; margin-top: 2px; }
  .selbox { width: 24px; height: 38px; display: flex; align-items: center; justify-content: center; flex: none; font-size: 19px; color: #07c160; }

  #typing { flex: none; min-height: 0; padding: 0 12px; font-size: 12.5px; color: #888; }
  #typing.on { padding: 5px 12px; }
  #replybar { flex: none; background: #f0f0f0; border-top: 1px solid #ddd; padding: 6px 12px; font-size: 13px; color: #555; display: none; align-items: center; gap: 8px; }
  #replybar.on { display: flex; }
  #replybar .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #replybar button { border: 0; background: none; color: #07c160; font-size: 13px; }

  footer { flex: none; background: #f7f7f7; border-top: 1px solid #ddd; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; position: relative; }
  footer .iconbtn { border: 0; background: none; font-size: 24px; padding: 2px; flex: none; }
  #input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 16px; background: #fff; outline: none; min-width: 0; }
  #send { background: #07c160; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; flex: none; }
  #atpop { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 4px); background: #fff; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; max-height: 260px; overflow-y: auto; z-index: 30; }
  #atpop.on { display: block; }
  #atpop .item { padding: 11px 14px; font-size: 15px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px; align-items: center; }
  #atpop .item:last-child { border-bottom: 0; }
  #atpop .mini { width: 26px; height: 26px; border-radius: 6px; font-size: 13px; }

  #stkpanel { flex: none; background: #f7f7f7; border-top: 1px solid #ddd; padding: 10px; display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; }
  #stkpanel.on { display: grid; }
  #stkpanel .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; background: #fff; border: 1px solid #eee; font-size: 11px; color: #666; }
  #stkpanel .cell img { width: 52px; height: 52px; object-fit: contain; }
  #stkpanel .cell .e { font-size: 34px; line-height: 1.15; }

  #selbar { flex: none; background: #333; color: #fff; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: none; align-items: center; gap: 10px; font-size: 14px; }
  #selbar.on { display: flex; }
  #selbar button { border: 1px solid #666; background: #444; color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 14px; }
  #selbar button.danger { background: #d33; border-color: #d33; }
  #selbar .sp { flex: 1; }

  .page { position: fixed; inset: 0; background: #f2f2f2; z-index: 50; display: none; flex-direction: column; }
  .page.on { display: flex; }
  .page header { background: #f7f7f7; }
  .page .back { border: 0; background: none; font-size: 15px; color: #07c160; padding: 4px 2px; flex: none; }
  .page .body { flex: 1; overflow-y: auto; padding: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 15.5px; }
  .card label { display: block; font-size: 13px; color: #666; margin: 10px 0 4px; }
  .card input[type=text], .card input[type=password], .card textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 9px; font-size: 15px; outline: none; }
  .card textarea { resize: vertical; min-height: 54px; }
  .btn { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14.5px; background: #07c160; color: #fff; }
  .btn.gray { background: #eee; color: #333; }
  .btn.red { background: #e64340; color: #fff; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .rowline { display: flex; align-items: center; gap: 8px; }
  .rowline .grow { flex: 1; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .switchline { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .models span { background: #eef6ee; border: 1px solid #bfe3bf; color: #2c6e2c; border-radius: 20px; padding: 4px 10px; font-size: 12.5px; }
  .memlist { margin-top: 6px; }
  .memitem { display: flex; align-items: center; gap: 8px; background: #f7f7f7; border-radius: 8px; padding: 7px 10px; margin-top: 6px; font-size: 13.5px; }
  .memitem .t { flex: 1; word-break: break-word; }
  .memitem button { border: 0; background: none; color: #d33; font-size: 15px; }
  .favitem { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 14.5px; }
  .favitem .who { font-size: 12.5px; color: #888; margin-bottom: 4px; }
  .empty { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }

  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; display: none; align-items: flex-end; justify-content: center; }
  #sheet.on { display: flex; }
  #sheet .box { background: #fff; width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  #sheet button { display: block; width: 100%; border: 0; background: none; padding: 14px; font-size: 16px; border-bottom: 1px solid #f0f0f0; }
  #sheet button:last-child { border-bottom: 0; }
  #sheet button.danger { color: #d33; }
  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 14px; z-index: 99; display: none; }
  .toast.on { display: block; }
</style>
</head>
<body>
<header>
  <div class="title"><div class="gname" id="gname">AI 群聊</div></div>
  <button class="hbtn" id="btn-favs">收藏</button>
  <button class="hbtn" id="btn-selmode">多选</button>
  <button class="hbtn" id="btn-manage">群管理</button>
  <button class="hbtn" id="btn-settings">设置</button>
</header>
<div id="announce" title=""></div>

<main id="msgs"></main>
<div id="typing"></div>

<div id="replybar"><span class="txt" id="replytxt"></span><button id="replycancel">取消</button></div>

<div id="stkpanel"></div>

<footer id="composer">
  <button class="iconbtn" id="btn-stk" title="表情包">😊</button>
  <input id="input" type="text" placeholder="说点什么… 输入 @ 可以提及成员" autocomplete="off">
  <button id="send">发送</button>
  <div id="atpop"></div>
</footer>

<div id="selbar">
  <span id="selcount">已选 0 条</span>
  <span class="sp"></span>
  <button id="selall">全选</button>
  <button class="danger" id="seldelete">删除所选</button>
  <button id="selcancel">取消</button>
</div>

<!-- 群管理 -->
<section class="page" id="page-manage">
  <header><button class="back" data-close>‹ 返回</button><div class="title"><div class="gname">群管理</div></div></header>
  <div class="body">
    <div class="card">
      <h3>成员</h3>
      <div id="memberlist"></div>
    </div>
    <div class="card">
      <h3>添加新成员</h3>
      <label>名字</label><input type="text" id="add-name" placeholder="例如：新成员">
      <label>模型 id</label><input type="text" id="add-model" placeholder="例如：gpt-4o-mini">
      <label>一句话介绍 / 人设（可选）</label><input type="text" id="add-bio" placeholder="例如：爱抬杠，嘴毒心软">
      <div style="margin-top:12px"><button class="btn" id="add-btn">添加进群</button></div>
      <div class="hint">新成员默认使用全局接口；也可以在设置页给他单独设接口和 key。</div>
    </div>
    <div class="card">
      <h3>聊天记录</h3>
      <div class="rowline">
        <a href="/api/export" class="grow"><button class="btn gray" type="button">导出聊天记录（txt）</button></a>
      </div>
      <div style="margin-top:12px">
        <label class="switchline"><input type="checkbox" id="clear-confirm"> 我知道清空后找不回来</label>
        <div style="margin-top:10px"><button class="btn red" id="clear-btn">清空全部聊天记录</button></div>
      </div>
    </div>
  </div>
</section>

<!-- 设置 -->
<section class="page" id="page-settings">
  <header><button class="back" data-close>‹ 返回</button><div class="title"><div class="gname">设置</div></div></header>
  <div class="body">
    <div class="card">
      <h3>群与我</h3>
      <label>群名</label><input type="text" id="set-gname">
      <label>群公告</label><textarea id="set-ann"></textarea>
      <label>我的名字（群里显示）</label><input type="text" id="set-myname">
    </div>
    <div class="card">
      <h3>全局默认接口</h3>
      <label>接口地址 base（OpenAI 兼容，一般以 /v1 结尾）</label>
      <input type="text" id="set-gbase" placeholder="https://example.com/v1">
      <label>API key</label>
      <input type="password" id="set-gkey" placeholder="留空表示不修改">
      <div class="hint" id="gkey-hint"></div>
      <label class="switchline" style="margin-top:12px"><input type="checkbox" id="set-lifelike"> 活人感（开后无 @ 时成员自己决定要不要插话）</label>
      <div style="margin-top:14px" class="rowline">
        <button class="btn" id="set-save">保存设置</button>
        <button class="btn gray" id="gkey-clear">清除全局 key</button>
      </div>
      <div class="hint">key 只保存在这台服务器的 data.json 里，不会发到任何别的地方。</div>
    </div>
    <div id="membercards"></div>
  </div>
</section>

<!-- 收藏 -->
<section class="page" id="page-favs">
  <header><button class="back" data-close>‹ 返回</button><div class="title"><div class="gname">我的收藏</div></div></header>
  <div class="body" id="favlist"></div>
</section>

<div id="sheet"><div class="box">
  <button id="sh-fav">收藏</button>
  <button id="sh-reply">回复</button>
  <button id="sh-del" class="danger">删除这条</button>
  <button id="sh-cancel">取消</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
'use strict';
var S = null;               // 最近一次 /api/state
var selMode = false;
var selected = {};          // id -> true
var replyToId = null;
var actionMsgId = null;
var lastSig = '';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t) { var el = $('toast'); el.textContent = t; el.className = 'toast on'; setTimeout(function () { el.className = 'toast'; }, 1800); }
function api(path, body) {
  var opt = { headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (r) {
    if (r.status === 401) { location.reload(); throw new Error('需要密码'); }
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
  });
}
function fmtTime(t) { var d = new Date(t); function p(n) { return (n < 10 ? '0' : '') + n; } return p(d.getHours()) + ':' + p(d.getMinutes()); }
function memberOf(key) { if (!S) return null; for (var i = 0; i < S.members.length; i++) if (S.members[i].key === key) return S.members[i]; return null; }
function stickerOf(label) { if (!S) return null; for (var i = 0; i < S.stickers.length; i++) if (S.stickers[i].label === label) return S.stickers[i]; return null; }

/* ---------- 渲染聊天 ---------- */
function stickerHtml(label, cls) {
  var st = stickerOf(label);
  if (!st) return '<div class="bubble">[表情包：' + esc(label) + ']</div>';
  if (st.type === 'img') return '<img class="' + (cls || 'stkimg') + '" src="/stickers/' + esc(st.file) + '" alt="' + esc(label) + '">';
  return '<div class="stkemoji">' + esc(st.emoji) + '</div>';
}

function msgHtml(m, prev) {
  if (m.senderKey === 'system') return '<div class="sys"><span>' + esc(m.content) + '</span></div>';
  var isMe = m.senderKey === 'me';
  var mem = isMe ? null : memberOf(m.senderKey);
  var color = isMe ? '#5aa469' : (mem ? mem.color : '#888');
  var initial = esc((m.senderName || '?').slice(0, 1));
  var cont = prev && prev.senderKey === m.senderKey && prev.senderKey !== 'system' && !m.replyToId;
  var inner = '';
  if (m.replyTo) {
    inner += '<div class="quote">' + (m.replyTo.deleted ? '<i>原消息已删除</i>' : esc(m.replyTo.senderName) + '：' + esc(m.replyTo.content)) + '</div>';
  }
  if (m.sticker) inner += stickerHtml(m.sticker);
  else inner += '<div class="bubble' + (cont ? ' cont' : '') + '">' + esc(m.content) + '</div>';
  if (m.favorite) inner += '<div class="favmark">★ 已收藏</div>';
  var sel = selMode ? '<div class="selbox">' + (selected[m.id] ? '☑' : '☐') + '</div>' : '';
  var av = cont ? '<div style="width:38px;flex:none"></div>'
    : '<div class="avatar" data-avkey="' + esc(m.senderKey) + '" data-avname="' + esc(m.senderName) + '" style="background:' + color + '">' + initial + '</div>';
  var name = cont ? '' : '<div class="name">' + esc(m.senderName) + ' · ' + fmtTime(m.time) + '</div>';
  return '<div class="row' + (isMe ? ' me' : '') + '" data-mid="' + m.id + '">' + sel + av +
    '<div class="col">' + name + inner + '</div></div>';
}

function renderMessages() {
  if (!S) return;
  var box = $('msgs');
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  var html = '';
  var prev = null;
  for (var i = 0; i < S.messages.length; i++) { html += msgHtml(S.messages[i], prev); prev = S.messages[i]; }
  box.innerHTML = html || '<div class="empty">还没有消息，发一条打个招呼吧</div>';
  if (nearBottom || selMode) box.scrollTop = box.scrollHeight;
  $('gname').textContent = S.settings.groupName;
  var ann = $('announce');
  ann.textContent = '📢 ' + S.settings.announcement;
  ann.title = S.settings.announcement;
  ann.style.display = S.settings.announcement ? 'block' : 'none';
  var tp = $('typing');
  if (S.typing && S.typing.length) {
    tp.textContent = S.typing.join('、') + (S.typingCount > S.typing.length ? ' 等 ' + S.typingCount + ' 人' : '') + (S.settings.lifelike ? ' 正在看看要不要插话…' : ' 正在回复中…');
    tp.className = 'on';
  } else { tp.textContent = ''; tp.className = ''; }
  renderSelbar();
}

function renderSelbar() {
  $('selbar').className = selMode ? 'on' : '';
  $('composer').style.display = selMode ? 'none' : 'flex';
  var n = Object.keys(selected).length;
  $('selcount').textContent = '已选 ' + n + ' 条';
}

/* ---------- 轮询 ---------- */
function refresh() {
  return api('/api/state').then(function (st) {
    S = st;
    var last = st.messages.length ? st.messages[st.messages.length - 1].id : 0;
    var sig = st.messages.length + '|' + last + '|' + (st.typing || []).join(',') + '|' + st.settings.groupName + '|' + st.settings.announcement;
    if (sig !== lastSig) { lastSig = sig; renderMessages(); }
    if ($('page-favs').className.indexOf('on') >= 0) renderFavs();
  }).catch(function () {});
}
setInterval(refresh, 2000);

/* ---------- 发送 ---------- */
function setReply(id, label) {
  replyToId = id;
  var bar = $('replybar');
  if (id) { bar.className = 'on'; $('replytxt').textContent = '回复：' + label; }
  else { bar.className = ''; $('replytxt').textContent = ''; }
}
$('replycancel').onclick = function () { setReply(null, ''); };

function doSend() {
  var inp = $('input');
  var v = inp.value.trim();
  if (!v) return;
  var rt = replyToId;
  inp.value = ''; setReply(null, ''); hideAt();
  api('/api/messages', { content: v, replyToId: rt }).then(function () { refresh(); }).catch(function (e) { toast(e.message); inp.value = v; });
}
$('send').onclick = doSend;
$('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSend(); });

/* ---------- 表情面板 ---------- */
function renderStkPanel() {
  if (!S) return;
  var html = '';
  S.stickers.forEach(function (st) {
    html += '<div class="cell" data-stk="' + esc(st.label) + '">' +
      (st.type === 'img' ? '<img src="/stickers/' + esc(st.file) + '">' : '<div class="e">' + esc(st.emoji) + '</div>') +
      '<span>' + esc(st.label) + '</span></div>';
  });
  $('stkpanel').innerHTML = html;
}
$('btn-stk').onclick = function () {
  var p = $('stkpanel');
  var on = p.className.indexOf('on') < 0;
  if (on && !p.innerHTML) renderStkPanel();
  p.className = on ? 'on' : '';
};
$('stkpanel').addEventListener('click', function (e) {
  var cell = e.target.closest('[data-stk]');
  if (!cell) return;
  api('/api/sticker', { sticker: cell.getAttribute('data-stk') }).then(function () { $('stkpanel').className = ''; refresh(); }).catch(function (err) { toast(err.message); });
});

/* ---------- @ 提及 ---------- */
function hideAt() { $('atpop').className = ''; }
function showAt(filter) {
  if (!S) return;
  var items = [{ name: '所有人', key: 'all', color: '#07c160' }];
  S.members.forEach(function (m) { if (!m.removed) items.push({ name: m.name, key: m.key, color: m.color }); });
  items = items.filter(function (it) { return !filter || it.name.indexOf(filter) >= 0; });
  if (!items.length) { hideAt(); return; }
  $('atpop').innerHTML = items.map(function (it) {
    return '<div class="item" data-at="' + esc(it.name) + '"><div class="avatar mini" style="background:' + it.color + '">' + esc(it.name.slice(0, 1)) + '</div>' + esc(it.name) + '</div>';
  }).join('');
  $('atpop').className = 'on';
}
$('input').addEventListener('input', function () {
  var v = $('input').value;
  var m = v.match(/@([^\s@]*)$/);
  if (m) showAt(m[1]); else hideAt();
});
$('atpop').addEventListener('click', function (e) {
  var it = e.target.closest('[data-at]');
  if (!it) return;
  var inp = $('input');
  inp.value = inp.value.replace(/@([^\s@]*)$/, '@' + it.getAttribute('data-at') + ' ');
  hideAt(); inp.focus();
});
function insertAt(name) {
  var inp = $('input');
  if (!/@$/.test(inp.value) && inp.value && !/\s$/.test(inp.value)) inp.value += ' ';
  inp.value += '@' + name + ' ';
  inp.focus();
}

/* ---------- 长按头像 @ ---------- */
var pressTimer = null;
$('msgs').addEventListener('pointerdown', function (e) {
  var av = e.target.closest('[data-avkey]');
  if (!av) return;
  var key = av.getAttribute('data-avkey');
  if (key === 'me' || key === 'system') return;
  var name = av.getAttribute('data-avname');
  pressTimer = setTimeout(function () { insertAt(name); toast('已 @ ' + name); pressTimer = null; }, 500);
});
['pointerup', 'pointercancel', 'pointermove'].forEach(function (ev) {
  $('msgs').addEventListener(ev, function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
});

/* ---------- 点消息：多选 / 操作菜单 ---------- */
$('msgs').addEventListener('click', function (e) {
  var row = e.target.closest('[data-mid]');
  if (!row) return;
  var id = Number(row.getAttribute('data-mid'));
  if (selMode) {
    if (selected[id]) delete selected[id]; else selected[id] = true;
    renderMessages(); renderSelbar();
    return;
  }
  actionMsgId = id;
  var m = null;
  for (var i = 0; i < S.messages.length; i++) if (S.messages[i].id === id) m = S.messages[i];
  $('sh-fav').textContent = m && m.favorite ? '取消收藏' : '收藏';
  $('sheet').className = 'on';
});
$('sh-cancel').onclick = function () { $('sheet').className = ''; };
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').className = ''; });
$('sh-fav').onclick = function () {
  $('sheet').className = '';
  api('/api/messages/favorite', { id: actionMsgId }).then(function () { lastSig = ''; refresh(); }).catch(function (e) { toast(e.message); });
};
$('sh-reply').onclick = function () {
  $('sheet').className = '';
  var m = null;
  for (var i = 0; i < S.messages.length; i++) if (S.messages[i].id === actionMsgId) m = S.messages[i];
  if (m) setReply(m.id, m.senderName + '：' + (m.sticker ? '[表情包：' + m.sticker + ']' : m.content.slice(0, 30)));
  $('input').focus();
};
$('sh-del').onclick = function () {
  $('sheet').className = '';
  api('/api/messages/delete', { ids: [actionMsgId] }).then(function () { toast('已删除'); lastSig = ''; refresh(); }).catch(function (e) { toast(e.message); });
};

/* ---------- 多选 ---------- */
$('btn-selmode').onclick = function () { selMode = true; selected = {}; renderMessages(); };
$('selcancel').onclick = function () { selMode = false; selected = {}; renderMessages(); };
$('selall').onclick = function () {
  var all = S && Object.keys(selected).length === S.messages.length;
  selected = {};
  if (!all && S) S.messages.forEach(function (m) { selected[m.id] = true; });
  renderMessages();
};
$('seldelete').onclick = function () {
  var ids = Object.keys(selected).map(Number);
  if (!ids.length) { toast('先选几条'); return; }
  if (!confirm('确定删除选中的 ' + ids.length + ' 条消息吗？删了找不回来。')) return;
  api('/api/messages/delete', { ids: ids }).then(function () {
    selMode = false; selected = {}; toast('已删除'); lastSig = ''; refresh();
  }).catch(function (e) { toast(e.message); });
};

/* ---------- 页面开关 ---------- */
function openPage(id) {
  ['page-manage', 'page-settings', 'page-favs'].forEach(function (p) { $(p).className = 'page' + (p === id ? ' on' : ''); });
  if (id === 'page-manage') renderManage();
  if (id === 'page-settings') renderSettings();
  if (id === 'page-favs') renderFavs();
}
function closePages() { ['page-manage', 'page-settings', 'page-favs'].forEach(function (p) { $(p).className = 'page'; }); }
document.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = closePages; });
$('btn-manage').onclick = function () { openPage('page-manage'); };
$('btn-settings').onclick = function () { openPage('page-settings'); };
$('btn-favs').onclick = function () { openPage('page-favs'); };

/* ---------- 群管理 ---------- */
function renderManage() {
  if (!S) return;
  var html = '';
  S.members.forEach(function (m) {
    if (m.removed) return;
    html += '<div class="rowline" style="padding:9px 0;border-bottom:1px solid #f0f0f0">' +
      '<div class="avatar" style="background:' + m.color + ';width:34px;height:34px;font-size:14px">' + esc(m.name.slice(0, 1)) + '</div>' +
      '<div class="grow"><div style="font-size:15px">' + esc(m.name) + ' <span style="color:#999;font-size:12px">' + esc(m.vendor || '') + '</span></div>' +
      '<div class="hint" style="margin:0">' + esc(m.model) + (m.muted ? ' · 已禁言' : '') + '</div></div>' +
      '<button class="btn gray small" data-mute="' + m.key + '">' + (m.muted ? '解除禁言' : '禁言') + '</button>' +
      '<button class="btn red small" data-remove="' + m.key + '">移除</button></div>';
  });
  $('memberlist').innerHTML = html || '<div class="empty">群里还没有成员</div>';
}
$('memberlist').addEventListener('click', function (e) {
  var muteBtn = e.target.closest('[data-mute]');
  var rmBtn = e.target.closest('[data-remove]');
  if (muteBtn) {
    var m1 = memberOf(muteBtn.getAttribute('data-mute'));
    api('/api/members/' + m1.key + '/mute', { muted: !m1.muted }).then(function () { refresh().then(renderManage); }).catch(function (err) { toast(err.message); });
  }
  if (rmBtn) {
    var m2 = memberOf(rmBtn.getAttribute('data-remove'));
    if (!confirm('把 ' + m2.name + ' 移出群聊？')) return;
    api('/api/members/' + m2.key + '/remove', {}).then(function () { toast('已移除'); lastSig = ''; refresh().then(renderManage); }).catch(function (err) { toast(err.message); });
  }
});
$('add-btn').onclick = function () {
  var name = $('add-name').value.trim(), model = $('add-model').value.trim(), bio = $('add-bio').value.trim();
  if (!name || !model) { toast('名字和模型 id 都要填'); return; }
  api('/api/members', { name: name, model: model, bio: bio }).then(function () {
    $('add-name').value = ''; $('add-model').value = ''; $('add-bio').value = '';
    toast('已加入群聊'); lastSig = ''; refresh().then(renderManage);
  }).catch(function (e) { toast(e.message); });
};
$('clear-btn').onclick = function () {
  if (!$('clear-confirm').checked) { toast('先勾选确认'); return; }
  if (!confirm('真的要清空全部聊天记录吗？')) return;
  api('/api/messages/clear', {}).then(function () {
    $('clear-confirm').checked = false; toast('已清空'); lastSig = ''; refresh();
  }).catch(function (e) { toast(e.message); });
};

/* ---------- 设置 ---------- */
function renderSettings() {
  if (!S) return;
  $('set-gname').value = S.settings.groupName;
  $('set-ann').value = S.settings.announcement;
  $('set-myname').value = S.settings.myName;
  $('set-gbase').value = S.settings.globalBase;
  $('set-gkey').value = '';
  $('gkey-hint').textContent = S.settings.globalKeyHint ? '当前全局 key：' + S.settings.globalKeyHint + '（留空不改）' : '还没设全局 key。';
  $('set-lifelike').checked = !!S.settings.lifelike;
  var html = '';
  S.members.forEach(function (m) {
    if (m.removed) return;
    var mem = (m.memories || []).map(function (t, i) {
      return '<div class="memitem"><span class="t">' + esc(t) + '</span><button data-memdel="' + m.key + ':' + i + '">✕</button></div>';
    }).join('');
    html += '<div class="card"><h3><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:' + m.color + ';margin-right:6px"></span>' +
      esc(m.name) + ' <span style="color:#999;font-size:12.5px;font-weight:normal">' + esc(m.vendor || '') + '</span></h3>' +
      '<label>模型 id</label><input type="text" id="m-model-' + m.key + '" value="' + esc(m.model) + '">' +
      '<label>接口地址 base（留空用全局）</label><input type="text" id="m-base-' + m.key + '" value="' + esc(m.base) + '" placeholder="https://example.com/v1">' +
      '<label>API key（留空用全局 / 不修改）</label><input type="password" id="m-key-' + m.key + '" placeholder="' + (m.keyHint ? '当前：' + esc(m.keyHint) : '还没设') + '">' +
      '<label>介绍 / 人设</label><input type="text" id="m-bio-' + m.key + '" value="' + esc(m.bio || '') + '">' +
      '<div style="margin-top:12px" class="rowline"><button class="btn small" data-msave="' + m.key + '">保存</button>' +
      '<button class="btn gray small" data-models="' + m.key + '">获取模型列表</button>' +
      '<button class="btn gray small" data-mkeyclear="' + m.key + '">清除他的 key</button></div>' +
      '<div class="models" id="models-' + m.key + '"></div>' +
      '<label style="margin-top:16px">他的记忆小本本（最多 20 条）</label><div class="memlist" id="mem-' + m.key + '">' + (mem || '<div class="hint">还空着，聊着聊着他会自己记。</div>') + '</div>' +
      '<div class="rowline" style="margin-top:8px"><input type="text" id="memadd-' + m.key + '" placeholder="手动帮他记一条" class="grow" style="border:1px solid #ddd;border-radius:8px;padding:8px;font-size:14px">' +
      '<button class="btn gray small" data-memadd="' + m.key + '">加上</button>' +
      '<button class="btn gray small" data-memclear="' + m.key + '">清空记忆</button></div>' +
      '</div>';
  });
  $('membercards').innerHTML = html;
}
$('set-save').onclick = function () {
  api('/api/settings', {
    groupName: $('set-gname').value, announcement: $('set-ann').value,
    myName: $('set-myname').value, globalBase: $('set-gbase').value,
    globalKey: $('set-gkey').value, lifelike: $('set-lifelike').checked,
  }).then(function () { toast('已保存'); lastSig = ''; refresh().then(renderSettings); }).catch(function (e) { toast(e.message); });
};
$('gkey-clear').onclick = function () {
  if (!confirm('清除全局 key？用全局 key 的成员将无法回复。')) return;
  api('/api/settings', { clearGlobalKey: true }).then(function () { toast('已清除'); refresh().then(renderSettings); }).catch(function (e) { toast(e.message); });
};
$('membercards').addEventListener('click', function (e) {
  var save = e.target.closest('[data-msave]');
  var models = e.target.closest('[data-models]');
  var keyclear = e.target.closest('[data-mkeyclear]');
  var memdel = e.target.closest('[data-memdel]');
  var memadd = e.target.closest('[data-memadd]');
  var memclear = e.target.closest('[data-memclear]');
  var chip = e.target.closest('[data-chip]');
  if (chip) { var inp = $('m-model-' + chip.getAttribute('data-chip')); if (inp) inp.value = chip.textContent; return; }
  if (save) {
    var k = save.getAttribute('data-msave');
    api('/api/members/' + k + '/settings', {
      model: $('m-model-' + k).value, base: $('m-base-' + k).value,
      apiKey: $('m-key-' + k).value, bio: $('m-bio-' + k).value,
    }).then(function () { toast('已保存'); refresh().then(renderSettings); }).catch(function (err) { toast(err.message); });
  }
  if (keyclear) {
    var k2 = keyclear.getAttribute('data-mkeyclear');
    api('/api/members/' + k2 + '/settings', { clearKey: true }).then(function () { toast('已清除'); refresh().then(renderSettings); }).catch(function (err) { toast(err.message); });
  }
  if (models) {
    var k3 = models.getAttribute('data-models');
    var box = $('models-' + k3);
    box.innerHTML = '<span style="background:#f0f0f0;border-color:#ddd;color:#666">拉取中…</span>';
    // 先把当前填的 base/key 存上，再拉列表（用的是已保存的配置）
    api('/api/members/' + k3 + '/settings', { base: $('m-base-' + k3).value, apiKey: $('m-key-' + k3).value }).then(function () {
      return fetch('/api/models?member=' + encodeURIComponent(k3)).then(function (r) { return r.json(); });
    }).then(function (j) {
      if (j.error) throw new Error(j.error);
      if (!j.models.length) { box.innerHTML = '<span style="background:#f0f0f0;border-color:#ddd;color:#666">接口没返回模型</span>'; return; }
      box.innerHTML = j.models.map(function (id) { return '<span data-chip="' + k3 + '">' + esc(id) + '</span>'; }).join('');
      toast('点模型名即可填入');
    }).catch(function (err) { box.innerHTML = '<span style="background:#fdecec;border-color:#f3c2c2;color:#a33">' + esc(err.message) + '</span>'; });
  }
  if (memdel) {
    var parts = memdel.getAttribute('data-memdel').split(':');
    api('/api/members/' + parts[0] + '/memory/delete', { index: Number(parts[1]) }).then(function () { refresh().then(renderSettings); }).catch(function (err) { toast(err.message); });
  }
  if (memadd) {
    var k4 = memadd.getAttribute('data-memadd');
    var t = $('memadd-' + k4).value.trim();
    if (!t) return;
    api('/api/members/' + k4 + '/memory', { text: t }).then(function () { refresh().then(renderSettings); }).catch(function (err) { toast(err.message); });
  }
  if (memclear) {
    var k5 = memclear.getAttribute('data-memclear');
    if (!confirm('清空他的全部记忆？')) return;
    api('/api/members/' + k5 + '/memory/clear', {}).then(function () { refresh().then(renderSettings); }).catch(function (err) { toast(err.message); });
  }
});

/* ---------- 收藏页 ---------- */
function renderFavs() {
  if (!S) return;
  var favs = S.messages.filter(function (m) { return m.favorite; });
  $('favlist').innerHTML = favs.length ? favs.map(function (m) {
    return '<div class="favitem"><div class="who">' + esc(m.senderName) + ' · ' + fmtTime(m.time) + '</div>' +
      (m.sticker ? stickerHtml(m.sticker) : '<div>' + esc(m.content) + '</div>') +
      '<div style="margin-top:8px"><button class="btn gray small" data-unfav="' + m.id + '">取消收藏</button></div></div>';
  }).join('') : '<div class="empty">还没有收藏的消息</div>';
}
$('favlist').addEventListener('click', function (e) {
  var b = e.target.closest('[data-unfav]');
  if (!b) return;
  api('/api/messages/favorite', { id: Number(b.getAttribute('data-unfav')) }).then(function () { lastSig = ''; refresh(); }).catch(function (err) { toast(err.message); });
});

/* ---------- 启动 ---------- */
refresh().then(function () {
  renderStkPanel();
  var box = $('msgs');
  box.scrollTop = box.scrollHeight;
});
</script>
</body>
</html>
